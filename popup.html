<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Issue Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="icon header-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h14v1.5H1zm2.5 4h9v1.5h-9zM6 11h4v1.5H6z"/></svg></span>
      <h1 class="header-title">GitHub Issue Filter</h1>
    </div>
    <div class="version-badge">v1.1.0</div>
  </header>

  <main class="main">
    <!-- Global Controls -->
    <section class="section">
      <div class="section-label">Global Controls</div>
      <div class="master-card">
        <div class="master-card-content">
          <div class="master-icon-box">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm2-.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5V4a.5.5 0 0 0-.5-.5zm8.22 2.28-5.5 5.5a.75.75 0 0 1-1.06 0l-2.5-2.5a.75.75 0 0 1 1.06-1.06L6.25 9.75l4.97-4.97a.75.75 0 0 1 1.06 1.06z"/></svg></span>
          </div>
          <div>
            <h3 class="master-title">All the things</h3>
            <p class="master-description">Toggle all filters simultaneously</p>
          </div>
        </div>
        <label class="toggle toggle-large">
          <input type="checkbox" id="masterToggle">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Project Events -->
    <section class="section">
      <div class="section-header">
        <span class="icon section-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M5.75 1a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-.75.75H4.5v2.5h3.25v-.75a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-.75.75H8.5a.75.75 0 0 1-.75-.75V11H4a1 1 0 0 1-1-1V6.5H1.75A.75.75 0 0 1 1 5.75V1.75A.75.75 0 0 1 1.75 1zM2.5 2.5v2.5H5V2.5zM9.25 9v2.5h2.5V9z"/></svg></span>
        <span class="section-label">Project Events</span>
      </div>
      <div class="filter-card">
        <div class="filter-row" data-for="addedToProject">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M7.25 3v4.25H3v1.5h4.25V13h1.5V8.75H13v-1.5H8.75V3z"/></svg></span>
            <span class="filter-name">Added to project</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="addedToProject">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="movedInProject">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a.75.75 0 0 1 .53.22l3.5 3.5a.75.75 0 0 1-1.06 1.06L8.75 4.06V14a.75.75 0 0 1-1.5 0V4.06L5.03 6.28a.75.75 0 0 1-1.06-1.06l3.5-3.5A.75.75 0 0 1 8 1.5z"/></svg></span>
            <span class="filter-name">Moved in project</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="movedInProject">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="statusChanged">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 1.25a.75.75 0 0 1 .53.22l2.5 2.5a.75.75 0 0 1 0 1.06l-2.5 2.5a.75.75 0 0 1-1.06-1.06L12.44 5H3.75a.75.75 0 0 1 0-1.5h8.69l-1.47-1.47a.75.75 0 0 1 .22-1.28zM4.5 14.75a.75.75 0 0 1-.53-.22l-2.5-2.5a.75.75 0 0 1 0-1.06l2.5-2.5a.75.75 0 0 1 1.06 1.06L3.56 11h8.69a.75.75 0 0 1 0 1.5H3.56l1.47 1.47a.75.75 0 0 1-.53 1.28z"/></svg></span>
            <span class="filter-name">Status changed</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="statusChanged">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Issue Events -->
    <section class="section">
      <div class="section-header">
        <span class="icon section-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>
        <span class="section-label">Issue Events</span>
      </div>
      <div class="filter-card">
        <div class="filter-row" data-for="assigned">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zm.514 3.063a4 4 0 1 0-6.028 0C3.1 9.122 2 10.928 2 13a.75.75 0 0 0 1.5 0c0-1.578 1.03-3.004 2.756-3.4L8 10.5l1.744-.9C11.47 9.996 12.5 11.422 12.5 13a.75.75 0 0 0 1.5 0c0-2.072-1.1-3.878-2.986-4.937z"/></svg></span>
            <span class="filter-name">Assigned</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="assigned">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="unassigned">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zm.514 3.063a4 4 0 1 0-6.028 0C3.1 9.122 2 10.928 2 13a.75.75 0 0 0 1.5 0c0-1.578 1.03-3.004 2.756-3.4L8 10.5l1.744-.9C11.47 9.996 12.5 11.422 12.5 13a.75.75 0 0 0 1.5 0c0-2.072-1.1-3.878-2.986-4.937z"/></svg></span>
            <span class="filter-name">Unassigned</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="unassigned">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="labeled">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.75 1.75 0 0 1 1 7.775zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25zM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg></span>
            <span class="filter-name">Labeled</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="labeled">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="unlabeled">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.75 1.75 0 0 1 1 7.775zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25zM2.5 1.5l11 11m1-1-11-11"/></svg></span>
            <span class="filter-name">Unlabeled</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="unlabeled">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="milestoned">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 1a.75.75 0 0 1 .75.75v.5h7.5a.75.75 0 0 1 .6 1.2L10.3 6.5l2.3 3.05a.75.75 0 0 1-.6 1.2H4.5v3.5a.75.75 0 0 1-1.5 0V1.75A.75.75 0 0 1 3.75 1zM4.5 9.25h6.75L9.35 6.8a.75.75 0 0 1 0-.9L11.25 3.5H4.5z"/></svg></span>
            <span class="filter-name">Milestoned</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="milestoned">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="renamed">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758zm1.414 1.06a.25.25 0 0 0-.354 0L3.462 11.1a.25.25 0 0 0-.064.108l-.563 1.97 1.971-.564a.25.25 0 0 0 .108-.064l8.609-8.61a.25.25 0 0 0 0-.353z"/></svg></span>
            <span class="filter-name">Renamed</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="renamed">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Other Events -->
    <section class="section">
      <div class="section-header">
        <span class="icon section-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25zM3.5 4h9v1.5h-9zm0 3.5h9V9h-9zm0 3.5h5V12.5h-5z"/></svg></span>
        <span class="section-label">Other Events</span>
      </div>
      <div class="filter-card">
        <div class="filter-row" data-for="crossReferenced">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M4.75 1.5a.75.75 0 0 0-.75.75v3.816l-1.47-1.47a.75.75 0 0 0-1.06 1.06l2.75 2.75a.75.75 0 0 0 1.06 0l2.75-2.75a.75.75 0 0 0-1.06-1.06L5.5 6.066V2.25a.75.75 0 0 0-.75-.75zm6.5 0a.75.75 0 0 0-.75.75v3.816l-1.47-1.47a.75.75 0 0 0-1.06 1.06l2.75 2.75a.75.75 0 0 0 1.06 0l2.75-2.75a.75.75 0 0 0-1.06-1.06L12 6.066V2.25a.75.75 0 0 0-.75-.75zM8 10a.75.75 0 0 1 .75.75v2.5a.75.75 0 0 1-1.5 0v-2.5A.75.75 0 0 1 8 10z"/></svg></span>
            <span class="filter-name">Cross-referenced</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="crossReferenced">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="closed">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0z"/></svg></span>
            <span class="filter-name">Closed</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="closed">
            <span class="slider"></span>
          </label>
        </div>
        <div class="filter-row" data-for="reopened">
          <div class="filter-row-left">
            <span class="icon row-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M3.38 8A4.63 4.63 0 0 1 8 3.38a4.6 4.6 0 0 1 3.8 2L9.75 7.44h5.5V1.94l-2.03 2.03A6.59 6.59 0 0 0 8 1.38 6.63 6.63 0 0 0 1.38 8zm9.24 0A4.63 4.63 0 0 1 8 12.62a4.6 4.6 0 0 1-3.8-2l2.05-2.06H.75v5.5l2.03-2.03A6.59 6.59 0 0 0 8 14.62 6.63 6.63 0 0 0 14.62 8z"/></svg></span>
            <span class="filter-name">Reopened</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="reopened">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>
  </main>

  <button id="resetBtn" class="sr-only">Reset to defaults</button>
  <script src="popup.js"></script>
</body>
</html>
